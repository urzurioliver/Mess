<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MESS Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-viewport">
    <header class="header-brand">
      <h1 class="brand-title">MESS</h1>
      <span style="background: var(--brand-pink); color: white; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem;">ADMIN</span>
    </header>

    <!-- FORMULARIO LOGIN -->
    <section id="login-section" class="ticket-container" style="margin-top: 30px;">
      <h3 style="text-align: center; margin-bottom: 15px;">INGRESO ADMINISTRACIÓN</h3>
      <input type="password" id="admin-pass" class="ticket-input" placeholder="Contraseña">
      <button onclick="login()" class="btn-primary-action">Entrar</button>
    </section>

    <!-- LISTADO DE PEDIDOS -->
    <section id="pedidos-section" style="display: none;">
      <div id="pedidos-list"></div>
    </section>
  </div>

  <script>
    let token = localStorage.getItem('mess_admin_token');

    if (token) mostrarPedidos();

    async function login() {
      const password = document.getElementById('admin-pass').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.token) {
        token = data.token;
        localStorage.setItem('mess_admin_token', token);
        mostrarPedidos();
      } else {
        alert("Contraseña incorrecta");
      }
    }

    async function mostrarPedidos() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('pedidos-section').style.display = 'block';

      const res = await fetch('/api/admin/pedidos', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const pedidos = await res.json();

      const container = document.getElementById('pedidos-list');
      container.innerHTML = '';

      pedidos.forEach(p => {
        const card = document.createElement('div');
        card.className = 'ticket-container';
        card.style.marginBottom = '20px';
        card.innerHTML = `
          <h3>PEDIDO #${p.id}</h3>
          <p><strong>Cliente:</strong> ${p.nombre}</p>
          <p><strong>Curso:</strong> ${p.curso}</p>
          <p><strong>Entrega:</strong> ${p.metodo_entrega}</p>
          <p><strong>Pago:</strong> ${p.metodo_pago} ($${p.total})</p>
          ${p.comprobante_url ? `<p><a href="${p.comprobante_url}" target="_blank" style="color: var(--brand-pink);">Ver Comprobante</a></p>` : ''}
          <div style="margin-top: 10px;">
            <select onchange="cambiarEstado(${p.id}, this.value)" class="ticket-input" style="background: var(--brand-pink); color: white; border: none;">
              <option value="Pendiente" ${p.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
              <option value="Preparando" ${p.estado === 'Preparando' ? 'selected' : ''}>Preparando</option>
              <option value="Listo" ${p.estado === 'Listo' ? 'selected' : ''}>Listo para entregar</option>
              <option value="Entregado" ${p.estado === 'Entregado' ? 'selected' : ''}>Entregado</option>
            </select>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function cambiarEstado(id, estado) {
      await fetch(`/api/admin/pedidos/${id}/estado`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ estado })
      });
    }
  </script>
</body>
</html>
